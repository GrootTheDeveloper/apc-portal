name: apc-portal-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apc_portal}
      POSTGRES_USER: ${POSTGRES_USER:-apc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apc_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Lưu tệp qua S3 API. MinIO đã gỡ image khỏi Docker Hub (09/2026) nên dùng SeaweedFS.
  storage:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-apc_local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-apc_local_only}
      S3_BUCKET: ${S3_BUCKET:-apc-portal}
    ports:
      - "127.0.0.1:9000:8333"   # S3 API
      - "127.0.0.1:9001:23646"  # Admin UI
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  storage_data:
